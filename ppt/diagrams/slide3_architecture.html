<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', -apple-system, sans-serif;
      background: #ffffff;
      color: #0f172a;
      width: 1400px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1380 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
    <title id="arch-title">KAVACH Technical Architecture</title>
    <desc id="arch-desc">Layered architectural flow of KAVACH Sovereign Agentic AI Workbench</desc>
    <defs>
      <marker id="arr-down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto"><polygon points="0 0, 8 0, 4 6" fill="#2563eb"/></marker>
    </defs>

    <rect width="100%" height="100%" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Left 70%: 6-Tier Architecture Stack -->
    <g transform="translate(30, 30)">
      <!-- Tier 1: User Workbench UI -->
      <rect x="0" y="0" width="920" height="65" rx="8" fill="#1e293b"/>
      <rect x="15" y="15" width="220" height="35" rx="5" fill="#334155"/>
      <text x="125" y="38" fill="#38bdf8" font-size="11" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">TIER 1 · WORKBENCH UI</text>
      <text x="250" y="34" fill="#ffffff" font-size="13" font-weight="700">Responsive Web Interface (FastAPI + Asynchronous Document Drop)</text>
      <text x="250" y="52" fill="#94a3b8" font-size="10.5">Chat, Document Upload (.pdf, .png, .jpg), Live Knowledge Toggle, Grounded Answer Viewer</text>

      <!-- Down Arrow 1 -> 2 -->
      <line x1="460" y1="65" x2="460" y2="78" stroke="#2563eb" stroke-width="2"/>

      <!-- Tier 2: Agent Orchestrator -->
      <rect x="0" y="80" width="920" height="65" rx="8" fill="#2563eb"/>
      <rect x="15" y="95" width="220" height="35" rx="5" fill="#1d4ed8"/>
      <text x="125" y="118" fill="#ffffff" font-size="11" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">TIER 2 · ORCHESTRATOR</text>
      <text x="250" y="114" fill="#ffffff" font-size="13" font-weight="700">Needle 2 &amp; Model Router: Plan ➔ Act ➔ Verify Execution Loop</text>
      <text x="250" y="132" fill="#dbeafe" font-size="10.5">Step-budgeted autonomous task decomposition, tool dispatching, and anti-hallucination auditor</text>

      <!-- Down Arrow 2 -> 3 -->
      <line x1="460" y1="145" x2="460" y2="158" stroke="#2563eb" stroke-width="2"/>

      <!-- Tier 3: Specialized Models -->
      <g transform="translate(0, 160)">
        <rect width="920" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="15" y="12" width="220" height="30" rx="4" fill="#0f172a"/>
        <text x="125" y="32" fill="#38bdf8" font-size="10.5" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">TIER 3 · SPECIALIST LLMS</text>
        
        <!-- 3 Model Cards -->
        <g transform="translate(15, 48)">
          <rect width="280" height="28" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
          <text x="140" y="19" fill="#1e40af" font-size="10" font-weight="700" text-anchor="middle">🧠 Qwen 3.5 (4B) · Reasoning &amp; RAG</text>
        </g>
        <g transform="translate(310, 48)">
          <rect width="285" height="28" rx="4" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.2"/>
          <text x="142" y="19" fill="#86198f" font-size="10" font-weight="700" text-anchor="middle">💻 Qwen 2.5-Coder (7B) · Python/SQL</text>
        </g>
        <g transform="translate(610, 48)">
          <rect width="295" height="28" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <text x="147" y="19" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">👁️ GLM-OCR (q8_0) · Vision &amp; Scans</text>
        </g>
        <text x="250" y="32" fill="#0f172a" font-size="12" font-weight="700">Open-Weight Specialist Models (No Monolith Bloat · 4-bit/8-bit Quantized)</text>
      </g>

      <!-- Down Arrow 3 -> 4 -->
      <line x1="460" y1="245" x2="460" y2="258" stroke="#2563eb" stroke-width="2"/>

      <!-- Tier 4: Local Inference Runtime -->
      <rect x="0" y="260" width="920" height="65" rx="8" fill="#0d9488"/>
      <rect x="15" y="275" width="220" height="35" rx="5" fill="#0f766e"/>
      <text x="125" y="298" fill="#ffffff" font-size="11" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">TIER 4 · RUNTIME ENGINE</text>
      <text x="250" y="294" fill="#ffffff" font-size="13" font-weight="700">Ollama Local Inference Runtime (CPU &amp; On-Premise GPU Accelerated)</text>
      <text x="250" y="312" fill="#ccfbf1" font-size="10.5">Sub-second local response time · Zero external network ports · Zero API token costs</text>

      <!-- Down Arrow 4 -> 5 -->
      <line x1="460" y1="325" x2="460" y2="338" stroke="#2563eb" stroke-width="2"/>

      <!-- Tier 5: Local RAG & Tools -->
      <g transform="translate(0, 340)">
        <rect width="920" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="15" y="12" width="220" height="30" rx="4" fill="#0f172a"/>
        <text x="125" y="32" fill="#38bdf8" font-size="10.5" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">TIER 5 · EMBEDDINGS &amp; TOOLS</text>
        <g transform="translate(15, 48)">
          <rect width="280" height="28" rx="4" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
          <text x="140" y="19" fill="#0e7490" font-size="10" font-weight="700" text-anchor="middle">📐 Nomic Embed Text (768-dim)</text>
        </g>
        <g transform="translate(310, 48)">
          <rect width="285" height="28" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <text x="142" y="19" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">⚡ Pure-Python In-Memory Vector Space</text>
        </g>
        <g transform="translate(610, 48)">
          <rect width="295" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
          <text x="147" y="19" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">🛡️ Isolated Local Sandboxed Tools</text>
        </g>
        <text x="250" y="32" fill="#0f172a" font-size="12" font-weight="700">Grounded Knowledge Retrieval &amp; Safe Local Execution Environment</text>
      </g>

      <!-- Down Arrow 5 -> 6 -->
      <line x1="460" y1="425" x2="460" y2="438" stroke="#2563eb" stroke-width="2"/>

      <!-- Tier 6: Air-Gapped MRPL LAN -->
      <rect x="0" y="440" width="920" height="75" rx="8" fill="#0f172a"/>
      <rect x="15" y="455" width="220" height="45" rx="5" fill="#1e293b"/>
      <text x="125" y="482" fill="#4ade80" font-size="11" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">TIER 6 · MRPL AIR-GAP</text>
      <text x="250" y="472" fill="#ffffff" font-size="13" font-weight="700">100% On-Premise Industrial LAN (Mangalore Refinery &amp; Petrochemicals Ltd)</text>
      <text x="250" y="492" fill="#94a3b8" font-size="11">Zero Data Egress · Tamper-proof Audit Logs · Complete MoP&amp;NG Cybersecurity Compliance</text>
    </g>

    <!-- Right 30%: Security & Tech Specs Sidebar -->
    <g transform="translate(980, 30)">
      <!-- Security Shield Card -->
      <rect width="370" height="195" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
      <text x="185" y="35" fill="#b91c1c" font-size="13" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">🔒 AIR-GAP SECURITY GUARANTEE</text>
      
      <g transform="translate(20, 50)">
        <rect width="330" height="35" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="15" y="23" fill="#991b1b" font-size="11" font-weight="700">❌ NO Cloud APIs (No OpenAI/Azure)</text>
      </g>
      <g transform="translate(20, 95)">
        <rect width="330" height="35" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="15" y="23" fill="#991b1b" font-size="11" font-weight="700">❌ NO External Outbound Telemetry</text>
      </g>
      <g transform="translate(20, 140)">
        <rect width="330" height="38" rx="6" fill="#0f172a"/>
        <text x="165" y="24" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">✅ 100% Sovereign Offline Operation</text>
      </g>

      <!-- Hardware & Performance Card -->
      <g transform="translate(0, 215)">
        <rect width="370" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect width="370" height="38" rx="10" fill="#0f172a"/>
        <rect y="30" width="370" height="8" fill="#0f172a"/>
        <text x="185" y="25" fill="#38bdf8" font-size="11.5" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">HARDWARE &amp; BENCHMARKS</text>

        <g transform="translate(20, 50)">
          <text x="0" y="16" fill="#0f172a" font-size="11" font-weight="700">🖥️ Minimum Workstation HW:</text>
          <text x="0" y="34" fill="#64748b" font-size="10.5">Intel i7 / Ryzen 7 · 16GB RAM · No GPU required</text>
        </g>

        <g transform="translate(20, 100)">
          <text x="0" y="16" fill="#0f172a" font-size="11" font-weight="700">🚀 Production Server Specs:</text>
          <text x="0" y="34" fill="#64748b" font-size="10.5">1x NVIDIA RTX 3060/4090 or A100 (Sub-sec inference)</text>
        </g>

        <g transform="translate(20, 150)">
          <text x="0" y="16" fill="#0f172a" font-size="11" font-weight="700">⚡ Retrieval Latency:</text>
          <text x="0" y="34" fill="#64748b" font-size="10.5">&lt; 150ms Cosine similarity search over 1000+ chunks</text>
        </g>

        <g transform="translate(20, 200)">
          <text x="0" y="16" fill="#0f172a" font-size="11" font-weight="700">💰 Economic ROI:</text>
          <text x="0" y="34" fill="#64748b" font-size="10.5">₹0 per-token billing · Millions saved annually</text>
        </g>

        <g transform="translate(20, 248)">
          <rect width="330" height="35" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
          <text x="165" y="22" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle">Target PS: SIH26117 (MRPL Refinery)</text>
        </g>
      </g>
    </g>
  </svg>
</body>
</html>
