<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', -apple-system, sans-serif;
      background: #ffffff;
      color: #0f172a;
      width: 1400px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

    <!-- Background -->
    <rect width="100%" height="100%" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

      <g transform="translate(20, 65)">

        <text x="16" y="48" fill="#475569" font-size="10.5">Physical sheets, pump check logs,</text>

        <rect width="280" height="85" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>

    <rect x="355" y="260" width="50" height="16" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="380" y="272" fill="#1e40af" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">INGEST</text>

    <!-- Center Box: KAVACH Sovereign Engine -->

      <rect width="520" height="490" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <rect width="520" height="45" rx="10" fill="#2563eb"/>
      <rect y="35" width="520" height="10" fill="#2563eb"/>
      <text x="260" y="28" fill="#ffffff" font-size="13" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2. KAVACH LOCAL INTELLIGENCE CORE</text>

      <!-- 4 Core Submodules Grid -->
      <!-- Submodule A: Multimodal OCR -->
      <g transform="translate(20, 60)">

      <g transform="translate(270, 60)">
        <rect width="230" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>

        <text x="16" y="78" fill="#334155" font-size="10">Zero database setup burden.</text>
        <rect x="16" y="92" width="130" height="18" rx="3" fill="#2563eb"/>
        <text x="81" y="104" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">SUB-SECOND SEARCH</text>
      </g>

      <!-- Submodule C: Model Router -->
      <g transform="translate(20, 195)">
        <rect width="230" height="120" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.2"/>
        <text x="16" y="26" fill="#86198f" font-size="12" font-weight="700">🔀 Smart Router &amp; Needle 2</text>

        <rect x="16" y="92" width="125" height="18" rx="3" fill="#a855f7"/>
        <text x="78" y="104" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">AGENTIC LOOP</text>
      </g>

      <!-- Submodule D: Specialist Models -->
      <g transform="translate(270, 195)">
        <rect width="230" height="120" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
        <text x="16" y="26" fill="#9a3412" font-size="12" font-weight="700">🧠 Qwen 3.5 &amp; Coder 7B</text>
        <text x="16" y="46" fill="#334155" font-size="10">Qwen 3.5:4B (Grounded RAG)</text>
        <text x="16" y="62" fill="#334155" font-size="10">Qwen 2.5-Coder:7B (Code)</text>
        <text x="16" y="78" fill="#334155" font-size="10">Anti-hallucination verification.</text>
        <rect x="16" y="92" width="130" height="18" rx="3" fill="#ea580c"/>
        <text x="81" y="104" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">SPECIALIST LLMS</text>
      </g>

      <!-- Central Security Badge -->
      <g transform="translate(20, 330)">
        <rect width="480" height="135" rx="8" fill="#0f172a"/>
        <text x="240" y="32" fill="#38bdf8" font-size="12" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">🔒 100% AIR-GAPPED HARDWARE PERIMETER</text>
        <text x="240" y="60" fill="#ffffff" font-size="11" text-anchor="middle">Runs entirely on Local Org PCs &amp; GPU Servers via Ollama Runtime</text>
        <text x="240" y="82" fill="#94a3b8" font-size="10" text-anchor="middle">Zero Internet · Zero Telemetry · Zero External Dependencies</text>
        <text x="240" y="108" fill="#4ade80" font-size="10" font-weight="600" text-anchor="middle">Tested &amp; Proven with MRPL Industrial PDF/OCR Pipeline</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M 940,285 H 1000" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-emerald)"/>
    <rect x="945" y="260" width="50" height="16" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="970" y="272" fill="#065f46" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">OUTPUT</text>

    <!-- Right Box: Industrial Deliverables -->
    <g transform="translate(1010, 40)">
      <rect width="340" height="490" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <rect width="340" height="45" rx="10" fill="#10b981"/>
      <rect y="35" width="340" height="10" fill="#10b981"/>
      <text x="170" y="28" fill="#ffffff" font-size="13" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3. AUDIT-READY OUTPUTS</text>

      <g transform="translate(20, 265)">
        <rect width="300" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>

      <g transform="translate(20, 365)">
        <rect width="300" height="100" rx="8" fill="#0f172a"/>
        <text x="150" y="32" fill="#4ade80" font-size="11" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">✅ ZERO-EGRESS PROOF</text>
        <text x="150" y="56" fill="#e2e8f0" font-size="10" text-anchor="middle">Tamper-proof local audit logs</text>
        <text x="150" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Complete compliance with PS 26117</text>
      </g>
